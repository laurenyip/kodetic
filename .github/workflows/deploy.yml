name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out

      - name: Enable GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          BODY='{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}'

          if gh api "repos/${REPO}/pages" >/dev/null 2>&1; then
            echo "Updating Pages configuration..."
            gh api "repos/${REPO}/pages" --method PUT --input - <<<"$BODY"
          else
            echo "Creating Pages site..."
            gh api "repos/${REPO}/pages" --method POST --input - <<<"$BODY"
          fi

          gh api "repos/${REPO}/pages" --jq '"Pages URL: " + .html_url + " (status: " + .status + ")"'
