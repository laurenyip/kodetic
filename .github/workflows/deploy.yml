name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out

      - name: Pages setup reminder
        run: |
          echo "Deploy complete. If the site 404s, enable Pages once:"
          echo "https://github.com/${{ github.repository }}/settings/pages"
          echo "Source: Deploy from a branch -> gh-pages / (root)"
          echo "Live URL: https://laurenyip.github.io/kodetic/"
